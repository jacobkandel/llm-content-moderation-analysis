repos:
  # Python: fast linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Python: type-safe import sorting (ruff handles formatting, black for safety net)
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black

  # General: trailing whitespace, end-of-file newlines, YAML/JSON syntax
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key  # Prevent accidental API key commits
