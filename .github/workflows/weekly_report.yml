name: Weekly AI Analyst Report

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest audit log from Vercel Blob
        run: |
          curl -f -o web/public/audit_log.csv.gz \
            https://oeqbf51ent3zxva1.public.blob.vercel-storage.com/data/audit_log.csv.gz
          gzip -df web/public/audit_log.csv.gz
          echo "Audit log downloaded: $(wc -l < web/public/audit_log.csv) rows"

      - name: Generate AI Analyst Report
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          PYTHONPATH=. python src/analysis/analyst.py

      - name: Verify report was generated
        run: |
          test -f web/public/latest_report.md || (echo "ERROR: latest_report.md not created" && exit 1)
          echo "Report size: $(wc -c < web/public/latest_report.md) bytes"
          head -3 web/public/latest_report.md

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/latest_report.md
          git diff --cached --quiet && echo "No changes to commit" || (
            git commit -m "Auto-update: Weekly AI Analyst Report $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin main
          )
