name: Weekly AI Analyst Report

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6am UTC
  workflow_dispatch:     # Allow manual trigger

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest audit log from Vercel Blob
        run: |
          mkdir -p web/public
          echo "📥 Downloading latest audit log from Vercel Blob..."
          curl -f -o web/public/audit_log.csv.gz https://oeqbf51ent3zxva1.public.blob.vercel-storage.com/data/audit_log.csv.gz
          gzip -df web/public/audit_log.csv.gz
          echo "✅ audit_log.csv ready ($(wc -l < web/public/audit_log.csv) rows)"

      - name: Run AI Analyst
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONPATH: .
        run: PYTHONPATH=. python src/analysis/analyst.py

      - name: Verify report output
        run: |
          test -f web/public/latest_report.md && echo "✅ Report generated" || exit 1

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/latest_report.md
          git diff --cached --quiet || git commit -m "Auto-update: Weekly AI Analyst Report"
          git pull --rebase origin main
          git push origin main
