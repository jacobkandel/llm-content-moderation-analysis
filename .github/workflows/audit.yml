name: Audit Pipeline

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Audit Tier (low, mid, high, efficiency)'
        required: true
        default: 'efficiency'
        type: choice
        options:
        - efficiency
        - low
        - mid
        - high
      skip_collection:
        description: 'Skip Model Collection (Use existing blob data)'
        required: false
        type: boolean
        default: false
      skip_llm_analysis:
        description: 'Skip LLM Analysis (Save costs)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 4 1,15 * *' # Run on the 1st and 15th of each month at 4am UTC (~biweekly)

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Expensive model collection → Blob upload.
  # No git write needed. If this fails, data is safe; sync-results is not run.
  # Skipped entirely when skip_collection=true.
  # ───────────────────────────────────────────────────────────────────────────
  run-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: ${{ inputs.skip_collection != true }}
    permissions:
      contents: read   # read-only — no git commits in this job

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        env:
          OPENROUTER_API_KEY: "mock_key_for_ci"
          PYTHONPATH: .
        continue-on-error: true
        run: python -m pytest -W ignore::DeprecationWarning --tb=short -q

      - name: Download Existing Data (Persist History)
        run: |
          mkdir -p web/public
          echo "📥 Downloading existing audit log from Vercel Blob..."
          if curl -f -o web/public/audit_log.csv.gz https://oeqbf51ent3zxva1.public.blob.vercel-storage.com/data/audit_log.csv.gz; then
            echo "✅ Download successful."
            gzip -df web/public/audit_log.csv.gz
            echo "✅ Decompressed to web/public/audit_log.csv"
          else
            echo "⚠️ No existing data found. Starting fresh."
          fi

      - name: Run Model Collection
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONPATH: .
        run: |
          TIER="${{ inputs.tier }}"
          if [ -z "$TIER" ]; then TIER="efficiency"; fi
          echo "🚀 Running Audit Tier: $TIER"

          if [ "$TIER" == "efficiency" ]; then
            ARGS="--preset low --resolve-latest --consistency 1"
          elif [ "$TIER" == "low" ]; then
            ARGS="--preset low --resolve-latest"
          elif [ "$TIER" == "mid" ]; then
            ARGS="--preset mid --resolve-latest"
          elif [ "$TIER" == "high" ]; then
            ARGS="--preset high"
          else
            echo "❌ Unknown tier: $TIER"; exit 1
          fi

          MAX_ATTEMPTS=3; ATTEMPT=1; DELAY=30
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "=== Attempt $ATTEMPT of $MAX_ATTEMPTS ==="
            if python src/audit_runner.py $ARGS; then
              echo "✅ Model collection completed"; exit 0
            fi
            echo "❌ Attempt $ATTEMPT failed"
            [ $ATTEMPT -lt $MAX_ATTEMPTS ] && sleep $DELAY && DELAY=$((DELAY * 2))
            ATTEMPT=$((ATTEMPT + 1))
          done
          exit 1

      - name: Run XSTest Over-Refusal Benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONPATH: .
        run: |
          echo "📐 Running XSTest over-refusal benchmark (100 safe prompts)..."
          python src/audit_runner.py \
            --benchmark xstest \
            --limit 100 \
            --preset low \
            --resolve-latest \
            --consistency 1 \
            --output web/public/xstest_results.csv \
          || echo "⚠️ XSTest benchmark failed (non-critical, skipping)"

      - name: Upload Data to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          cd web
          npm install @vercel/blob
          node scripts/upload-blob.js
          cd ..

      - name: Upload Benchmark Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: web/public/xstest_results.csv
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Report generation + git commit + deploy.
  # Always starts from a FRESH checkout → clean working tree → push never fails.
  # Runs on success OR when run-audit was skipped (skip_collection=true).
  # ───────────────────────────────────────────────────────────────────────────
  sync-results:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: run-audit
    if: always() && (needs.run-audit.result == 'success' || needs.run-audit.result == 'skipped')
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Audit Data from Blob
        run: |
          mkdir -p web/public
          echo "📥 Downloading latest audit log from Vercel Blob..."
          if curl -f -o web/public/audit_log.csv.gz https://oeqbf51ent3zxva1.public.blob.vercel-storage.com/data/audit_log.csv.gz; then
            gzip -df web/public/audit_log.csv.gz
            echo "✅ audit_log.csv ready ($(wc -l < web/public/audit_log.csv) rows)"
          else
            echo "❌ Could not download audit log from Blob — nothing to sync."
            exit 1
          fi

      - name: Download Benchmark Results Artifact
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: web/public/
        continue-on-error: true  # xstest_results.csv is optional

      - name: Compress Data
        run: python scripts/compress_data.py

      - name: Generate Semantic Clusters
        run: python3 src/cluster_analysis_simple.py

      - name: Generate All Reports & Visuals
        env:
          SKIP_LLM_ANALYSIS: ${{ inputs.skip_llm_analysis }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONPATH: .
        run: bash scripts/generate_all_reports.sh

      - name: Build Next.js App
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          cd web
          npm ci
          npm run build

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Validate JSON outputs
        run: python scripts/validate_outputs.py --dir web/public

      - name: Clean up Large Files
        run: |
          echo "🧹 Removing large files before git commit..."
          rm -f web/public/audit_log.csv.gz
          rm -f web/public/audit_log.csv
          rm -f web/public/xstest_results.csv
          rm -f audit.db
          rm -rf data/raw_traces/
          rm -rf web/public/assets/history/
          rm -f data/prompts_full_db.csv
          rm -f data/prompts_augmented.csv
          rm -f web/public/assets/traces_small.json
          rm -rf src/
          rm -rf scripts/
          echo "📦 Remaining large files (top 20 by size):"
          find . -not -path './.git/*' -not -path './web/.next/*' -type f \
            -exec du -sh {} + 2>/dev/null | sort -rh | head -20

      - name: Commit & Push Results to main
        # Fresh checkout = no dirty files = git push always succeeds first try.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for file in web/public/*.json web/public/assets/ data/trends.csv web/public/latest_report.md; do
            if [ -e "$file" ]; then
              git add "$file"
            fi
          done
          git diff --cached --quiet || git commit -m "Auto-update: Audit Results (${{ steps.date.outputs.date }})"
          # Safely merge any commits that landed on main while this job was running
          git fetch origin main
          git rebase origin/main || (git rebase --abort && git merge --no-edit origin/main)
          git push origin HEAD:main

      - name: Upload Audit Data Backup
        uses: actions/upload-artifact@v4
        with:
          name: audit-data-backup
          path: |
            web/public/*.json
            data/trends.csv

      - name: Deploy to Vercel (Preview)
        id: vercel_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p web/public/data
          if [ -f "data/latest_report.md" ]; then
            cp data/latest_report.md web/public/
          fi
          PREVIEW_URL=$(npx vercel deploy --token=$VERCEL_TOKEN --yes)
          echo "Deployed to: $PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Ping IndexNow (Bing, Yandex, DuckDuckGo)
        run: |
          echo "🔔 Notifying search engines via IndexNow..."
          INDEXNOW_KEY="f5108eb2ee8a474e8b2c5ef375f7dad1"
          BASE_URL="https://moderationbias.com"
          URLS=$(cat <<EOF
          [
            "${BASE_URL}/", "${BASE_URL}/compare",
            "${BASE_URL}/analysis/summary", "${BASE_URL}/analysis/overview",
            "${BASE_URL}/analysis/drift", "${BASE_URL}/analysis/consensus",
            "${BASE_URL}/analysis/political", "${BASE_URL}/analysis/reliability",
            "${BASE_URL}/analysis/longitudinal", "${BASE_URL}/analysis/alignment",
            "${BASE_URL}/analysis/clusters", "${BASE_URL}/analysis/paternalism",
            "${BASE_URL}/analysis/significance", "${BASE_URL}/analysis/triggers",
            "${BASE_URL}/data", "${BASE_URL}/feed.xml"
          ]
          EOF
          )
          curl -s -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"moderationbias.com\",
              \"key\": \"${INDEXNOW_KEY}\",
              \"keyLocation\": \"${BASE_URL}/${INDEXNOW_KEY}.txt\",
              \"urlList\": ${URLS}
            }" && echo "✅ IndexNow ping sent" || echo "⚠️ IndexNow ping failed (non-critical)"

      - name: Sync to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: "jmk9494/moderation-bias-benchmark"
        run: |
          pip install huggingface_hub datasets pandas pyarrow
          python scripts/sync_to_huggingface.py

      - name: Lighthouse CI Performance & Accessibility Check
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.vercel_deploy.outputs.PREVIEW_URL }}
            ${{ steps.vercel_deploy.outputs.PREVIEW_URL }}/compare
            ${{ steps.vercel_deploy.outputs.PREVIEW_URL }}/audit
          budgetPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
