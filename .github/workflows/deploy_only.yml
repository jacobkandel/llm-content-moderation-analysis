name: Deploy Only (No Audit)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Don't cd into web - Vercel project settings already point to web/ as root
          npx vercel deploy --prod --token=$VERCEL_TOKEN --yes

      # NOTE: HuggingFace sync is intentionally NOT run here. This is a deploy-only
      # workflow — the audit CSV is never generated/fetched, so a sync would always
      # fail. The dataset is synced from the full audit pipeline (audit.yml) instead.
