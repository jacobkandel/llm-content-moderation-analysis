
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Install from lock file for reproducible builds; fall back to requirements.txt
        if [ -f requirements.lock ]; then
          pip install -r requirements.lock
        else
          pip install -r requirements.txt
        fi
        pip install pytest httpx pytest-cov mypy

    - name: Verify Python Version
      run: python -c "import sys; assert sys.version_info >= (3, 10), f'Python 3.10+ required, got {sys.version}'"
        
    - name: Lint with Ruff
      run: ruff check src/ tests/

    - name: Check Formatting with Black
      run: black --check src/ tests/

    - name: Type Check with Mypy
      run: mypy src/ --ignore-missing-imports --no-error-summary || true

    - name: Check Prompt Dataset Integrity
      run: python scripts/check_prompts.py

    - name: Run All Python Tests with Coverage
      env:
        OPENROUTER_API_KEY: "mock_key_for_ci"
        PYTHONPATH: .
      run: |
        python -m pytest tests/ -v -W ignore::DeprecationWarning \
          --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

  web-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    
    - name: Install Dependencies
      run: npm ci
      working-directory: web
    
    - name: Lint with ESLint
      run: npm run lint
      working-directory: web
      continue-on-error: true

    - name: Build Next.js App
      env:
        NEXT_TELEMETRY_DISABLED: 1
      run: npm run build
      working-directory: web
